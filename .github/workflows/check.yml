name: Deployment contract examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deployment-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment examples
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/test_deployment_contract.py
      # The shared template job builds once, supplies real database/auth
      # configuration, and runs the original entrypoint/HTTP checks plus
      # seeded application checks in scripts/verify-template.mjs.
